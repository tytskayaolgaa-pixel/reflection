<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reflection [2025]</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='white' stroke='black' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root {
    /* fluid type scale: 24px on desktop, shrinks smoothly down to ~15px on phones */
    --fs: clamp(15px, 1.1vw + 11px, 24px);
    --fs-sm: clamp(12px, 0.5vw + 10px, 16px);
    --side-w: min(460px, 42vw);
    --gutter: clamp(16px, 4vw, 38px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: white;
    font-family: 'Arial Narrow', Arial, sans-serif;
    color: black;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    /* padding-top is kept in sync with the fixed header's real height via JS */
  }

  /* ---------- HEADER ---------- */
  header.top-bar {
    width: 100%;
    background: linear-gradient(0deg, white 2%, #979797 100%);
    position: fixed;
    top: 0;
    left: 0;
    z-index: 30;
    padding: 14px calc(var(--gutter) + 56px) 10px var(--gutter);
  }

  .top-icons {
    position: absolute;
    right: clamp(14px, 3vw, 32px);
    top: 10px;
    display: flex;
    gap: 10px;
  }

  .top-icons .dot {
    width: clamp(14px, 2.2vw, 23px);
    height: clamp(14px, 2.2vw, 23px);
    border-radius: 50%;
    border: 1px solid black;
    background: transparent;
    cursor: default;
  }

  .title-block {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 16px;
  }

  .title-block .title {
    font-size: var(--fs);
    color: black;
    text-decoration: none;
    cursor: pointer;
    white-space: nowrap;
  }

  .nav-link:hover,
  .nav-link.active {
    text-decoration: underline;
  }

  .title-block .year {
    font-size: var(--fs);
    white-space: nowrap;
  }

  .subtitle {
    display: inline-block;
    max-width: 100%;
    margin-top: 4px;
    font-size: var(--fs);
    font-style: italic;
  }

  /* ---------- MAIN LAYOUT ---------- */
  .main-wrap {
    flex: 1 0 auto;
    display: flex;
    align-items: flex-start;
    padding-top: 13px;
  }

  nav.side-menu {
    width: var(--side-w);
    flex-shrink: 0;
    padding-left: var(--gutter);
    display: flex;
    flex-direction: column;
    position: fixed;
    left: 0;
    z-index: 20;
    /* top is kept in sync with the header's real height via JS */
  }

  nav.side-menu a {
    display: block;
    font-size: var(--fs);
    color: black;
    text-decoration: none;
    padding: 0;
    line-height: 1.7;
    cursor: pointer;
    width: fit-content;
  }

  nav.side-menu a:hover,
  nav.side-menu a.active {
    text-decoration: underline;
  }

  nav.side-menu a.random-link {
    margin-top: 0;
  }

  .content-area {
    flex: 1;
    margin-left: var(--side-w);
    padding: 8px var(--gutter) 60px var(--gutter);
    min-height: 500px;
    min-width: 0;
  }

  /* Below this width the fixed side menu would leave too little room for
     content, so it drops into normal flow above the content instead. */
  @media (max-width: 720px) {
    :root { --side-w: 100%; }

    .main-wrap {
      flex-direction: column;
    }

    nav.side-menu {
      position: static !important;
      width: 100%;
      flex-direction: row;
      flex-wrap: wrap;
      column-gap: 28px;
      row-gap: 4px;
      padding: 0 var(--gutter) 16px var(--gutter);
    }

    .content-area {
      margin-left: 0;
      padding: 8px var(--gutter) 48px var(--gutter);
    }
  }

  /* ---------- ABOUT ---------- */
  .about-text {
    font-size: var(--fs);
    line-height: 1.35;
    max-width: 700px;
  }

  /* ---------- CONTACT ---------- */
  .contact-links {
    display: flex;
    gap: clamp(20px, 5vw, 60px);
    flex-wrap: wrap;
  }

  .contact-links a {
    font-size: var(--fs);
    color: black;
    text-decoration: none;
  }

  .contact-links a:hover {
    text-decoration: underline;
  }

  /* ---------- ARCHIVE GRID ---------- */
  .archive-grid {
    column-count: 4;
    column-gap: 20px;
    width: 100%;
  }

  .archive-grid img {
    width: 100%;
    display: block;
    margin-bottom: 20px;
    cursor: pointer;
    break-inside: avoid;
    transition: opacity 0.15s ease;
  }

  @media (max-width: 1100px) {
    .archive-grid { column-count: 3; }
  }

  @media (max-width: 720px) {
    .archive-grid { column-count: 2; column-gap: 12px; }
    .archive-grid img { margin-bottom: 12px; }
  }

  @media (max-width: 420px) {
    .archive-grid { column-count: 1; }
  }

  .archive-grid img:hover {
    opacity: 0.8;
  }

  /* ---------- RANDOM PICTURE VIEW ---------- */
  .random-view {
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .random-view img {
    max-width: 100%;
    max-height: 75vh;
    cursor: pointer;
  }

  .random-hint {
    font-size: var(--fs-sm);
    color: #d3d3d3;
    margin-top: 14px;
    text-align: center;
  }

  /* ---------- LIGHTBOX ---------- */
  .lightbox-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }

  .lightbox-overlay.open {
    display: flex;
  }

  .lightbox-overlay img {
    max-width: 88vw;
    max-height: 88vh;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .lightbox-close {
    position: absolute;
    top: clamp(12px, 3vw, 24px);
    right: clamp(16px, 4vw, 34px);
    color: white;
    font-size: clamp(22px, 5vw, 28px);
    font-family: Arial, sans-serif;
    cursor: pointer;
    line-height: 1;
    user-select: none;
  }

  /* ---------- FOOTER ---------- */
  footer.bottom-bar {
    flex-shrink: 0;
    padding: 0 var(--gutter) 24px var(--gutter);
  }

  .footer-inner {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    width: 100%;
  }

  .footer-inner .footer-name,
  .footer-inner .footer-domain {
    font-size: var(--fs);
    white-space: nowrap;
  }

  .footer-inner .footer-line {
    min-width: 40px;
  }

  .footer-inner .footer-domain {
    color: black;
    text-decoration: none;
  }

  .footer-inner .footer-domain:hover {
    text-decoration: underline;
  }

  .footer-inner .footer-line {
    flex: 1;
    height: 0;
    border-top: 1px solid black;
  }
</style>
</head>
<body>

  <header class="top-bar">
    <div class="top-icons">
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <div class="title-block">
      <a href="#" class="title nav-link" data-view="home" id="nav-reflection">reflection</a>
      <span class="year" id="year-label">[2025]</span>
    </div>
    <div class="subtitle">archive of scans of everyday human life</div>
  </header>

  <div class="main-wrap">
    <nav class="side-menu">
      <a data-view="about" id="nav-about" class="nav-link">about</a>
      <a data-view="contact" id="nav-contact" class="nav-link">contact</a>
      <a data-view="archive" id="nav-archive" class="nav-link">archive</a>
      <a data-view="random" id="nav-random" class="random-link nav-link">[random picture]</a>
    </nav>

    <div class="content-area" id="content-area">
      <!-- content injected by JS -->
    </div>
  </div>

  <footer class="bottom-bar">
    <div class="footer-inner">
      <span class="footer-name">olga tytskaya</span>
      <span class="footer-line"></span>
      <a class="footer-domain" href="http://tytskayadesign.ru" target="_blank" rel="noopener">tytskayadesign.ru</a>
    </div>
  </footer>

  <div class="lightbox-overlay" id="lightbox">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="scan">
  </div>

<script>
  // ---- Build archive file list (images/01.jpg ... images/168.jpg) ----
  const TOTAL_IMAGES = 168;
  const images = [];
  for (let i = TOTAL_IMAGES; i >= 1; i--) {
    const name = String(i).padStart(2, '0') + '.jpg';
    images.push('images/' + name);
  }

  const contentArea = document.getElementById('content-area');
  const navLinks = document.querySelectorAll('.nav-link');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxClose = document.getElementById('lightbox-close');

  function setActive(view) {
    navLinks.forEach(l => l.classList.toggle('active', l.dataset.view === view));
  }

  const headerEl = document.querySelector('.top-bar');
  const navEl = document.querySelector('.side-menu');

  // Align [2025] so its right edge matches the right edge of the italic subtitle
  function alignHeader() {
    const subtitle = document.querySelector('.subtitle');
    const titleBlock = document.querySelector('.title-block');
    if (subtitle && titleBlock) {
      titleBlock.style.width = Math.min(subtitle.offsetWidth, subtitle.parentElement.clientWidth) + 'px';
    }
  }

  // The header's height changes with viewport width (text can wrap on
  // narrow screens), so keep the page offset and the fixed side menu's
  // top position synced to its real, current height.
  function syncLayout() {
    alignHeader();
    const h = headerEl.offsetHeight;
    document.body.style.paddingTop = h + 'px';
    navEl.style.top = (h + 13) + 'px';
  }

  syncLayout();
  window.addEventListener('resize', syncLayout);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(syncLayout);
  }

  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.add('open');
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
  }

  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });

  function renderHome() {
    setActive('home');
    contentArea.innerHTML = '';
  }

  function renderAbout() {
    setActive('about');
    contentArea.innerHTML = `
      <div class="about-text">
        This archive is&nbsp;part of&nbsp;the &ldquo;Reflection&rdquo; project. All the&nbsp;images
        in&nbsp;it were collected in&nbsp;the&nbsp;spring of&nbsp;2025 during the&nbsp;preparation of&nbsp;the
        thesis project. The people participating in&nbsp;the&nbsp;project are my&nbsp;friends
        and&nbsp;acquaintances aged between 18 and&nbsp;30. I called it&nbsp;a&nbsp;study of&nbsp;the
        &ldquo;growing up&rdquo; generation. The project was a&nbsp;snapshot of&nbsp;a&nbsp;moment in&nbsp;time,
        a&nbsp;scan of&nbsp;reality, and it&nbsp;gave people the&nbsp;opportunity to&nbsp;feel like
        the&nbsp;main character.
      </div>
    `;
  }

  function renderContact() {
    setActive('contact');
    contentArea.innerHTML = `
      <div class="contact-links">
        <a href="https://t.me/otrazhenieprod" target="_blank" rel="noopener">tg</a>
        <a href="https://youtube.com/@tytskaya" target="_blank" rel="noopener">youtube</a>
        <a href="https://music.yandex.ru/album/36480070?ref_id=D6DA8EEB-4667-461F-8163-D7BBB702DA9B&utm_medium=copy_link" target="_blank" rel="noopener">yandex</a>
        <a href="https://podcasts.apple.com/ru/podcast/%D0%BE%D1%82%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5/id1811351993" target="_blank" rel="noopener">apple</a>
      </div>
    `;
  }

  function renderArchive() {
    setActive('archive');
    const grid = document.createElement('div');
    grid.className = 'archive-grid';
    images.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.loading = 'lazy';
      img.alt = 'scan';
      img.addEventListener('click', () => openLightbox(src));
      grid.appendChild(img);
    });
    contentArea.innerHTML = '';
    contentArea.appendChild(grid);
  }

  function renderRandom() {
    setActive('random');
    const src = images[Math.floor(Math.random() * images.length)];
    contentArea.innerHTML = `
      <div class="random-view">
        <div>
          <img id="random-img" src="${src}" alt="random scan">
          <div class="random-hint">click the picture for a new one</div>
        </div>
      </div>
    `;
    document.getElementById('random-img').addEventListener('click', renderRandom);
  }

  const views = {
    home: renderHome,
    about: renderAbout,
    contact: renderContact,
    archive: renderArchive,
    random: renderRandom,
  };

  navLinks.forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      views[link.dataset.view]();
    });
  });

  // Initial view — empty, until user picks a section
  renderHome();
</script>

</body>
</html>
